<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polirrubro Felisa</title>
    <!-- Iconos de FontAwesome para las redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #170d13;
            --card-bg: #261520;
            --text-color: #fceef5;
            --accent-gold: #f4a6c0;
            --accent-green: #d65a88;
            --btn-hover: #b8436f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 16px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--accent-gold);
            font-weight: 500;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background-color: var(--accent-green);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .link-btn i {
            font-size: 1.2rem;
            color: var(--accent-gold);
        }

        .link-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            border-color: var(--accent-gold);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }

        .footer {
            margin-top: 28px;
            font-size: 0.8rem;
            color: #8a99a0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Contenedor del Logo -->
        <div class="logo-container">
            <!-- Guarda tu imagen como 'logo.png' en el mismo repositorio -->
            <img src="Poli.jpeg" alt="Snorlab Logo">
        </div>

        <h1>FELISA</h1>
        <p class="subtitle">Polirrubro-Kiosko-Merceria</p>

        <!-- Botones con enlaces a Redes Sociales -->
        <div class="links-container">
            <a href="https://wa.me/2236989983" target="_blank" class="link-btn">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp / Pedidos
            </a>

            <a href="https://instagram.com/polirrubrofelisa" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>

            <a href="https://tiktok.com/@polirrubrofelisa" target="_blank" class="link-btn">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>

            <a href="https://TU_CATALOGO_O_TIENDA.com" target="_blank" class="link-btn">
                <i class="fa-solid fa-cube"></i> Catálogo de Productos
            </a>

            <a href="mailto:simplementelule@gmail.com" class="link-btn">
                <i class="fa-solid fa-envelope"></i> Contacto por Email
            </a>
        </div>

        <div class="footer">
            <p>© SNORLAB - Todos los derechos reservados</p>
        </div>
    </div>

</body>
</html>
